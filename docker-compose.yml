# Local end-to-end stack. Coolify deploys each service from its own Dockerfile
# instead — keep this for local testing only.
services:
  api:
    build:
      context: ./backend
    ports:
      - "3333:3333"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:3333"
    ports:
      - "3000:3000"
    depends_on:
      - api
