# Local end-to-end stack. Coolify deploys each service from its own Dockerfile
# instead — keep this for local testing only.
services:
  api:
    build:
      context: ./backend
    ports:
      - "3333:3333"
    env_file:
      # Local dev only; optional so deployments (Coolify) without this
      # gitignored file still start — env comes from the platform there.
      - path: ./backend/.env
        required: false
    environment:
      NODE_ENV: production

  web:
    build:
      context: .
      args:
        # Substituted from the Coolify build-time env file; defaults to
        # localhost for plain `docker compose up` on a dev machine.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3333}
    ports:
      - "3000:3000"
    depends_on:
      - api
